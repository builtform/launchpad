# osv-scanner per-directory config for the CVE-watch nightly scan
# (.github/workflows/cve-watch.yml). Applies to lockfiles in THIS
# directory only (no child-directory propagation).
#
# Policy: every entry MUST carry a reason with (a) why the finding is
# not exploitable here, (b) why the fix is currently unreachable, and
# (c) an ignoreUntil expiry so the suppression re-surfaces for review
# instead of rotting silently.
#
# Suppressing a GHSA id also suppresses its aliases (CVE-*, PYSEC-*).
#
# HISTORY: the click.edit() entry (PYSEC-2026-2132 / CVE-2026-7246) was
# removed on 2026-07-31 -- semgrep 1.171.0 relaxed its click~=8.1.8 pin,
# so `click` now resolves to 8.4.2 (>= the 8.3.3 fix) and the finding is
# genuinely fixed rather than suppressed. That is the intended lifecycle
# for every entry below.
#
# The three mcp entries (GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58,
# GHSA-vj7q-gjh5-988w) were removed on 2026-09-20 -- semgrep 1.177.0 no
# longer pins mcp==1.23.3, so `mcp` now resolves to 1.29.0 (>= the 1.27.2
# and 1.28.1 fixes) and the findings are fixed rather than suppressed.
#
# No suppressions are active.
